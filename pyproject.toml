[project]
name = "gpu-orchestrator"
version = "0.1.0"
description = "Decentralized P2P GPU orchestration for adaptive AI training — control plane, agent, trainer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic-settings==2.7.1",
    "pydantic==2.10.4",
]

[project.optional-dependencies]
server = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pyjwt==2.10.1",
    "cryptography==44.0.0",
]
agent = [
    "psutil==6.1.1",
    "httpx==0.28.1",
    "websockets==14.1",
    "cryptography==44.0.0",
]
trainer = [
    "torch==2.5.1",
]
dev = [
    "gpu-orchestrator[server,agent]",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*", "agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["orchestrator", "agent", "trainer", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["orchestrator", "agent", "trainer"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are the canonical exception to B008: calling
# them in argument defaults is the framework's intended usage.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
ignore_missing_imports = true
exclude = ["orchestrator/migrations/versions"]

[[tool.mypy.overrides]]
module = "orchestrator.migrations.*"
disallow_untyped_defs = false
