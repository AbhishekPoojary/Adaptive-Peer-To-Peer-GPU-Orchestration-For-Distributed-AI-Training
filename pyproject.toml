[project]
name = "gpu-orchestrator"
version = "0.1.0"
description = "Decentralized P2P GPU orchestration for adaptive AI training — control plane, agent, trainer."
readme = "README.md"
# Upper bound is real, not caution: the pinned pydantic-core 2.27.2 publishes
# Windows wheels only up to cp313. On 3.14 pip falls back to building it from
# Rust source, which needs a MSVC linker most peers do not have — a volunteer
# hit exactly that and the install died in a wall of cargo errors. Declaring the
# bound here makes pip refuse cleanly instead. Raise it when the pins do.
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "pydantic-settings==2.7.1",
    "pydantic==2.10.4",
]

[project.optional-dependencies]
server = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pyjwt==2.10.1",
    "cryptography==44.0.0",
    "prometheus-client==0.21.1",
]
agent = [
    "psutil==6.1.1",
    "httpx==0.28.1",
    "websockets==14.1",
    "cryptography==44.0.0",
    "nvidia-ml-py==12.560.30",
    "docker==7.1.0",
    "prometheus-client==0.21.1",
]
trainer = [
    "torch==2.5.1",
]
bench = [
    # The M9 harness validates every artifact against bench/schema.json before
    # writing it, so a malformed report cannot reach bench/report/.
    "jsonschema==4.26.0",
    "httpx==0.28.1",
    "psutil==6.1.1",
]
dev = [
    "gpu-orchestrator[server,agent,bench]",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# trainer* is here because a peer running unsandboxed (ADR-007 addendum)
# executes trainer/train.py as a child process. Without it, pip installs `agent`
# into site-packages and leaves trainer/ behind in the extracted source, so the
# agent enrolls, claims work, and fails every lease with "could not find
# trainer/train.py" — which is exactly what happened to the first real peer.
# Running from a checkout hid it, because there the layout works by accident.
include = ["orchestrator*", "agent*", "bench*", "trainer*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["orchestrator", "agent", "trainer", "bench", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["orchestrator", "agent", "trainer", "bench"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are the canonical exception to B008: calling
# them in argument defaults is the framework's intended usage.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
ignore_missing_imports = true
exclude = ["orchestrator/migrations/versions"]

[[tool.mypy.overrides]]
module = "orchestrator.migrations.*"
disallow_untyped_defs = false
