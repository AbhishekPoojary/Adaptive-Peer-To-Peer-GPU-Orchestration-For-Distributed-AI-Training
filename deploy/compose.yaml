services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchestrator} -d ${POSTGRES_DB:-orchestrator}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  orchestrator:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-orchestrator}:${POSTGRES_PASSWORD:-orchestrator}@postgres:5432/${POSTGRES_DB:-orchestrator}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-10}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5.0}
      S3_REGION: ${S3_REGION:-us-east-1}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_CHECKPOINTS: ${S3_BUCKET_CHECKPOINTS:-checkpoints}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-change-me}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      ENROLLMENT_TOKEN_TTL_SECONDS: ${ENROLLMENT_TOKEN_TTL_SECONDS:-3600}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      AUTH_NONCE_TTL_SECONDS: ${AUTH_NONCE_TTL_SECONDS:-120}
      USER_ACCESS_TOKEN_TTL_SECONDS: ${USER_ACCESS_TOKEN_TTL_SECONDS:-900}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-10}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60.0}
      NODE_AUTH_RATE_LIMIT_ATTEMPTS: ${NODE_AUTH_RATE_LIMIT_ATTEMPTS:-60}
      NODE_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${NODE_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60.0}
      RTT_EWMA_ALPHA: ${RTT_EWMA_ALPHA:-0.3}
      RELIABILITY_PRIOR_ALPHA: ${RELIABILITY_PRIOR_ALPHA:-1.0}
      RELIABILITY_PRIOR_BETA: ${RELIABILITY_PRIOR_BETA:-1.0}
      RELIABILITY_DECAY_HALFLIFE_SECONDS: ${RELIABILITY_DECAY_HALFLIFE_SECONDS:-86400.0}
      RELIABILITY_WILSON_Z: ${RELIABILITY_WILSON_Z:-1.96}
      SCHEDULER_STRATEGY: ${SCHEDULER_STRATEGY:-least_loaded}
      SCHEDULER_ALPHA_LOAD: ${SCHEDULER_ALPHA_LOAD:-1.0}
      SCHEDULER_BETA_RELIABILITY: ${SCHEDULER_BETA_RELIABILITY:-1.0}
      SCHEDULER_GAMMA_LATENCY: ${SCHEDULER_GAMMA_LATENCY:-0.5}
      SCHEDULER_LOAD_SIGNIFICANT_SPREAD: ${SCHEDULER_LOAD_SIGNIFICANT_SPREAD:-25.0}
      SCHEDULER_LATENCY_SIGNIFICANT_SPREAD_MS: ${SCHEDULER_LATENCY_SIGNIFICANT_SPREAD_MS:-50.0}
      LEASE_TTL_SECONDS: ${LEASE_TTL_SECONDS:-30}
      LEASE_RENEWAL_GRACE_SECONDS: ${LEASE_RENEWAL_GRACE_SECONDS:-5}
      UNCLAIMED_OFFER_BACKOFF_SECONDS: ${UNCLAIMED_OFFER_BACKOFF_SECONDS:-20.0}
      MAX_JOB_FAILURE_RETRIES: ${MAX_JOB_FAILURE_RETRIES:-2}
      FAILED_ATTEMPT_BACKOFF_SECONDS: ${FAILED_ATTEMPT_BACKOFF_SECONDS:-45.0}
      TRAINER_IMAGE: ${TRAINER_IMAGE:-gpu-orchestrator-trainer:latest}
      RENDEZVOUS_PORT: ${RENDEZVOUS_PORT:-29500}
      TORCHRUN_MAX_RESTARTS: ${TORCHRUN_MAX_RESTARTS:-1}
      TRAINING_BACKEND: ${TRAINING_BACKEND:-gloo}
      SCHEDULER_PASS_INTERVAL_SECONDS: ${SCHEDULER_PASS_INTERVAL_SECONDS:-3.0}
      LEASE_SWEEP_INTERVAL_SECONDS: ${LEASE_SWEEP_INTERVAL_SECONDS:-3.0}
      ENABLE_BACKGROUND_LOOPS: ${ENABLE_BACKGROUND_LOOPS:-true}
      FAILURE_DETECTOR_INTERVAL_SECONDS: ${FAILURE_DETECTOR_INTERVAL_SECONDS:-1.0}
      HEARTBEAT_FLOOR_SECONDS: ${HEARTBEAT_FLOOR_SECONDS:-5.0}
      PHI_ACCRUAL_THRESHOLD: ${PHI_ACCRUAL_THRESHOLD:-3.0}
      PHI_ACCRUAL_WINDOW_SAMPLES: ${PHI_ACCRUAL_WINDOW_SAMPLES:-20}
      PHI_ACCRUAL_MIN_STD_SECONDS: ${PHI_ACCRUAL_MIN_STD_SECONDS:-0.5}
      PHI_ACCRUAL_MIN_INTERVALS: ${PHI_ACCRUAL_MIN_INTERVALS:-3}
      PHI_ACCRUAL_BOOTSTRAP_SILENCE_SECONDS: ${PHI_ACCRUAL_BOOTSTRAP_SILENCE_SECONDS:-10.0}
      HEARTBEAT_STALE_SECONDS: ${HEARTBEAT_STALE_SECONDS:-15.0}
      NODE_DETAIL_DEFAULT_SAMPLES: ${NODE_DETAIL_DEFAULT_SAMPLES:-50}
      NODE_DETAIL_MAX_SAMPLES: ${NODE_DETAIL_MAX_SAMPLES:-500}
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  miniodata:
